# The dev container is Compose-based rather than a bare Dockerfile because the
# catalogue needs a real PostgreSQL: FR-015 ordering and FR-013 matching are
# database behaviours, so testing them anywhere else tests something the product
# does not do.
#
# Nothing in CI builds this file (see CLAUDE.md), so a green pull request does
# not verify it. Rebuild the container locally before merging a change here.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Keeps the container alive; VS Code attaches and runs the real processes.
    command: sleep infinity
    network_mode: service:db
    volumes:
      # The repository itself, bind mounted from the host. With a bare
      # Dockerfile VS Code adds this implicitly; under Compose it has to be
      # declared, and workspaceFolder in devcontainer.json must match it.
      - ..:/workspaces/vox-lib:cached
      # Named volumes survive a rebuild; /home/vscode is overlayfs and does not.
      # These were previously the "mounts" array in devcontainer.json and belong
      # here now that Compose owns the container.
      - vox-lib-claude:/home/vscode/.claude
      - vox-lib-gh:/home/vscode/.config/gh
      - vox-lib-bash-history:/commandhistory
      - vox-lib-nuget:/home/vscode/.nuget/packages
    environment:
      # The single source of truth for how the application and the tests reach
      # the database. Host is localhost because network_mode above puts this
      # container on the db container's network stack.
      VOXLIB_DB_CONNECTION: Host=localhost;Port=5432;Database=voxlib;Username=voxlib;Password=voxlib
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: voxlib
      POSTGRES_PASSWORD: voxlib
      POSTGRES_DB: voxlib
    volumes:
      # The data directory must be a named volume. Anything on the container
      # filesystem is erased on rebuild.
      - vox-lib-pgdata:/var/lib/postgresql
    healthcheck:
      # app waits on this, so the API never starts against a database that is
      # still running its bootstrap scripts.
      test: ['CMD-SHELL', 'pg_isready -U voxlib -d voxlib']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Object storage: covers now, and whatever the audio feature needs later.
  #
  # SeaweedFS rather than MinIO. MinIO's community edition was archived in
  # February 2026 and gets no security patches; its console was stripped a year
  # before that, and the community images and binaries were pulled from Docker
  # Hub and dl.min.io. SeaweedFS is Apache 2.0, actively developed, and speaks
  # the same S3 API -- which is the only thing this project asks of it.
  #
  # In production this is Cloudflare R2. Swapping the two costs five
  # configuration values and no code, because the adapter talks S3 through
  # AWSSDK.S3 rather than to any particular implementation (R4, FR-043). That
  # was verified rather than assumed: the API was run against both with nothing
  # changed but the Covers__ environment variables.
  storage:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    # Same network namespace as app and db, for the reason mailpit is: every
    # service here shares one stack, so the API reaches S3 at localhost:9000 and
    # a browser reaches a cover at the same address. On a bridge network the API
    # cannot see it at all.
    network_mode: service:db
    # One process carrying the master, a volume server, the filer and the S3
    # gateway. S3 is put on 9000 so the committed Covers:ServiceUrl needs no
    # port of its own; the filer's object browser is on 8888.
    command: >
      server -dir=/data -s3 -s3.port=9000
      -s3.config=/etc/seaweedfs/s3.json -filer -ip=127.0.0.1
    volumes:
      # The object store must outlive a rebuild for the same reason the database
      # must. It is a separate volume with a separate lifetime, which is why
      # CoverSeeder guards per object rather than per run.
      - vox-lib-storage:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Bucket creation stays out of application code, because bucket administration
  # is the one thing MinIO and R2 disagree about and an adapter that did it would
  # carry a development-only branch. In production Cloudflare creates it once, by
  # hand. Re-running this is harmless: it recreates nothing and deletes nothing.
  storage-setup:
    image: chrislusf/seaweedfs
    network_mode: service:db
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "echo 's3.bucket.create -name vox-lib-covers'
      | weed shell -master=localhost:9333"

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    # Same network namespace as app and db, so the API reaches SMTP at
    # localhost:1025 and a browser reaches the mailbox at localhost:8025.
    # An ordinary bridge network would leave it unreachable from the API, and
    # the symptom is a connection refused at the moment a message is sent.
    network_mode: service:db
    environment:
      # Development only: accept whatever credentials are offered, over plain
      # SMTP. Nothing here ever reaches a real address.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  # These four predate Compose: they were the "mounts" array in
  # devcontainer.json, so Docker created them under their plain names. Compose
  # otherwise prefixes every volume with the project name
  # (vox-lib_devcontainer_...), which silently mounts a *different*, empty
  # volume and looks like the data was lost. "name" pins the real name so the
  # existing volumes keep being used; unlike "external: true" it still lets
  # Compose create them on a machine that has none.
  vox-lib-claude:
    name: vox-lib-claude
  vox-lib-gh:
    name: vox-lib-gh
  vox-lib-bash-history:
    name: vox-lib-bash-history
  vox-lib-nuget:
    name: vox-lib-nuget
  # Not pinned: these two were born under Compose, so their prefixed names are
  # the ones holding the current data.
  vox-lib-pgdata:
  vox-lib-storage:
